name: Fuzz

# Scheduled rather than per-pull-request. A fuzz run is neither fast enough nor
# deterministic enough to gate a merge, and the property cover in `cargo test`
# is what catches a regression on the way in. This is for finding things that
# cover does not know to look for.
#
# Nightly and Linux only: cargo-fuzz needs the former, and libFuzzer is happiest
# on the latter. The stable Windows-and-Linux matrix in ci.yml is untouched.
on:
  schedule:
    - cron: "17 3 * * 0" # Sundays, early
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to spend on each target
        default: "300"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # Every target reports, rather than the first failure hiding the rest.
      fail-fast: false
      matrix:
        target:
          - ts_feed
          - scan_video_au
          - scan_survives_its_own_encoder
          - record_decode
          - flv_roundtrip
          - payload_decode
          - artnet_packet
          - h264_nals
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Restored before the seeds are written, so a run continues from what
      # earlier runs found rather than starting cold every week.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Seed the corpus
        run: cargo run --example seed-corpus

      - name: Fuzz
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.seconds || 300 }} \
            -print_final_stats=1

      # A crash is the whole point of the job, so the input that caused it has
      # to leave the runner. Without this the log says a target failed and the
      # reproducer is thrown away with the container.
      - name: Upload the reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

  # The other half of what the security review flagged: nothing was checking
  # the dependency tree for advisories or licence problems.
  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
