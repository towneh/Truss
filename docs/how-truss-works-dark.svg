<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" font-family="-apple-system, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif">
  <title>How Truss works</title>
  <desc>A lighting desk sends Art-Net to truss-relay, which packs the DMX into each video frame from the encoder as SEI and publishes over RTMP. A CDN that remuxes delivers the records intact; one that transcodes strips them. The relay also sends each record to an OSC listener.</desc>
  <style>
    .text  { fill: #1f2328; }
    .muted { fill: #59636e; }
    .box   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .group { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .video { stroke: #0969da; }
    .dmx   { stroke: #bf8700; }
    .osc   { stroke: #8250df; }
    .bad   { stroke: #cf222e; }
    .line  { fill: none; stroke-width: 2.5; }
    .fill-video { fill: #0969da; }
    .fill-dmx   { fill: #bf8700; }
    .fill-osc   { fill: #8250df; }
    .fill-bad   { fill: #cf222e; }
    .frame { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .lost  { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
      .text  { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .box   { fill: #161b22; stroke: #3d444d; }
      .group { stroke: #656c76; }
      .video { stroke: #4493f8; }
      .dmx   { stroke: #d29922; }
      .osc   { stroke: #ab7df8; }
      .bad   { stroke: #f85149; }
      .fill-video { fill: #4493f8; }
      .fill-dmx   { fill: #d29922; }
      .fill-osc   { fill: #ab7df8; }
      .fill-bad   { fill: #f85149; }
      .frame { fill: #0c2d6b; stroke: #4493f8; }
      .lost  { fill: #3c1618; stroke: #f85149; }
    .h  { font-size: 15px; font-weight: 600; }
    .s  { font-size: 12.5px; }
    .xs { font-size: 11px; }
  </style>
  <defs>
    <marker id="a-video" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill-video"/></marker>
    <marker id="a-dmx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill-dmx"/></marker>
    <marker id="a-osc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill-osc"/></marker>
    <marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fill-bad"/></marker>
    <!-- a video frame carrying a record: the picture, with the SEI block inside it -->
    <g id="frame-carried">
      <rect x="0" y="0" width="34" height="46" rx="3" class="frame"/>
      <rect x="5" y="32" width="24" height="9" rx="1.5" class="fill-dmx"/>
    </g>
    <g id="frame-stripped">
      <rect x="0" y="0" width="34" height="46" rx="3" class="frame"/>
      <rect x="5" y="32" width="24" height="9" rx="1.5" fill="none" class="bad" stroke-width="1.2" stroke-dasharray="3 2"/>
    </g>
  </defs>

  <!-- sources -->
  <rect x="20" y="57" width="160" height="56" rx="8" class="box"/>
  <text x="100" y="82" text-anchor="middle" class="text h">Lighting desk</text>
  <text x="100" y="100" text-anchor="middle" class="muted s">any Art-Net source</text>

  <rect x="20" y="202" width="160" height="56" rx="8" class="box"/>
  <text x="100" y="227" text-anchor="middle" class="text h">Encoder</text>
  <text x="100" y="245" text-anchor="middle" class="muted s">OBS or similar</text>

  <!-- the relay -->
  <rect x="250" y="20" width="250" height="300" rx="12" class="group"/>
  <text x="375" y="42" text-anchor="middle" class="text h">truss-relay</text>

  <rect x="270" y="55" width="210" height="60" rx="8" class="box"/>
  <text x="375" y="80" text-anchor="middle" class="text h">Art-Net receiver</text>
  <text x="375" y="99" text-anchor="middle" class="muted s">newest value per universe</text>

  <rect x="270" y="195" width="210" height="70" rx="8" class="box"/>
  <text x="375" y="221" text-anchor="middle" class="text h">Injector</text>
  <text x="375" y="240" text-anchor="middle" class="muted s">packs DMX into each frame</text>
  <text x="375" y="256" text-anchor="middle" class="muted s">as SEI user data</text>

  <path d="M375,115 L375,191" class="line dmx" marker-end="url(#a-dmx)"/>

  <path d="M180,85 L266,85" class="line dmx" marker-end="url(#a-dmx)"/>
  <text x="223" y="76" text-anchor="middle" class="muted xs">Art-Net</text>
  <text x="223" y="101" text-anchor="middle" class="muted xs">UDP 6454</text>

  <path d="M180,230 L266,230" class="line video" marker-end="url(#a-video)"/>
  <text x="223" y="221" text-anchor="middle" class="muted xs">RTMP</text>
  <text x="223" y="246" text-anchor="middle" class="muted xs">H.264 / HEVC</text>

  <!-- out of the relay: frames with the records inside them -->
  <path d="M480,230 L676,230" class="line video" marker-end="url(#a-video)"/>
  <use href="#frame-carried" x="513" y="207"/>
  <use href="#frame-carried" x="557" y="207"/>
  <use href="#frame-carried" x="601" y="207"/>
  <text x="578" y="195" text-anchor="middle" class="text s">video + DMX, RTMP</text>
  <text x="578" y="272" text-anchor="middle" class="muted xs">records ride inside the frame,</text>
  <text x="578" y="286" text-anchor="middle" class="muted xs">locked to the picture</text>

  <!-- ingest -->
  <rect x="680" y="195" width="130" height="70" rx="8" class="box"/>
  <text x="745" y="225" text-anchor="middle" class="text h">Ingest / CDN</text>
  <text x="745" y="244" text-anchor="middle" class="muted s">your path</text>

  <!-- remux: survives -->
  <path d="M810,215 C840,215 830,110 860,110 L956,110" class="line video" marker-end="url(#a-video)"/>
  <text x="868" y="98" class="text s" font-weight="600">remux</text>
  <use href="#frame-carried" x="880" y="118"/>
  <use href="#frame-carried" x="918" y="118"/>
  <text x="916" y="182" text-anchor="middle" class="muted xs">RTSP · MPEG-TS</text>
  <rect x="960" y="80" width="145" height="60" rx="8" class="box"/>
  <text x="1032" y="104" text-anchor="middle" class="text h">Records intact</text>
  <text x="1032" y="123" text-anchor="middle" class="muted xs">truss-detect · truss-dmxmon</text>

  <!-- transcode: stripped -->
  <path d="M810,245 C840,245 830,350 860,350 L956,350" class="line bad" marker-end="url(#a-bad)"/>
  <text x="868" y="338" class="text s" font-weight="600">transcode</text>
  <use href="#frame-stripped" x="880" y="358"/>
  <use href="#frame-stripped" x="918" y="358"/>
  <rect x="960" y="320" width="145" height="60" rx="8" class="lost"/>
  <text x="1032" y="344" text-anchor="middle" class="text h">Lighting lost</text>
  <text x="1032" y="363" text-anchor="middle" class="muted xs">picture plays, no warning</text>

  <!-- OSC lane -->
  <path d="M375,320 L375,430 L516,430" class="line osc" stroke-dasharray="7 5" marker-end="url(#a-osc)"/>
  <text x="388" y="380" class="muted xs">OSC /truss/dmx</text>
  <text x="388" y="395" class="muted xs">UDP 12100</text>
  <rect x="520" y="400" width="200" height="60" rx="8" class="box"/>
  <text x="620" y="425" text-anchor="middle" class="text h">OSC listener</text>
  <text x="620" y="444" text-anchor="middle" class="muted xs">truss-dmxmon osc:// · VRSL</text>

  <!-- key -->
  <g transform="translate(800,445)">
    <line x1="0" y1="0" x2="26" y2="0" class="line dmx"/>
    <text x="34" y="4" class="muted xs">DMX</text>
    <line x1="80" y1="0" x2="106" y2="0" class="line video"/>
    <text x="114" y="4" class="muted xs">video</text>
    <line x1="166" y1="0" x2="192" y2="0" class="line osc" stroke-dasharray="7 5"/>
    <text x="200" y="4" class="muted xs">OSC</text>
  </g>
</svg>
